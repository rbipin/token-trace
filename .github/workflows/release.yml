name: Release

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Set pyproject.toml version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/set_version.py "$TAG"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

  bump-version:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Commit released version to the default branch
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python .github/scripts/set_version.py "$TAG"
          if [ -n "$(git status --porcelain pyproject.toml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml
            git commit -m "chore(release): bump version to ${TAG#v} [skip ci]"
            git pull --rebase
            git push
          else
            echo "pyproject.toml already at ${TAG#v} — nothing to commit."
          fi
